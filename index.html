<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECM RFI Template</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- HTMX and Tailwind CSS -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles/main.css">

    <!-- Persistence & Export Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            /**
             * Restores checkbox states from localStorage to the DOM.
             */
            const restoreCheckboxes = () => {
                const savedStates = JSON.parse(localStorage.getItem('rfi-selections') || '{}');
                Object.entries(savedStates).forEach(([id, isChecked]) => {
                    const cb = document.getElementById(id);
                    if (cb) cb.checked = isChecked;
                });
            };

            /**
             * Updates the count indicators in the navigation buttons.
             * Scans all checkboxes on the page and updates the (n) text.
             */
            const updateCountIndicators = () => {
                const savedStates = JSON.parse(localStorage.getItem('rfi-selections') || '{}');
                const buttons = Array.from(document.querySelectorAll('.nav-btn'));
                
                buttons.forEach(btn => {
                    const targetUrl = btn.getAttribute('hx-get');
                    let count = 0;
                    const prefixMap = {
                        'components/functional.html': 'f-',
                        'components/non-functional.html': 'nf-',
                        'components/vendor.html': 'v-'
                    };
                    
                    const prefix = prefixMap[targetUrl];
                    if (prefix) {
                        Object.entries(savedStates).forEach(([id, isChecked]) => {
                            if (isChecked && id.startsWith(prefix)) {
                                count++;
                            }
                        });
                    }

                    const textContent = btn.innerText.split('(')[0].trim();
                    btn.innerHTML = `${textContent} <span class="ml-2 text-xs font-normal opacity-70">(${count})</span>`;
                });
            };

            /**
             * Listens for any checkbox changes within the page to persist state.
             */
            document.body.addEventListener('change', (event) => {
                if (event.target.name === 'rfi-selection') {
                    const savedStates = JSON.parse(localStorage.getItem('rfi-selections') || '{}');
                    savedStates[event.target.id] = event.target.checked;
                    localStorage.setItem('rfi-selections', JSON.stringify(savedStates));
                    updateCountIndicators();
                }
            }, true);

            /**
             * HTMX Lifecycle Hook: Re-apply checkboxes after new content is swapped in.
             */
            document.body.addEventListener('htmx:afterSwap', (event) => {
                restoreCheckboxes();
                updateCountIndicators();
            });

            /**
             * Export selected items to a downloadable CSV file.
             */
            const exportCSV = () => {
                const savedStates = JSON.parse(localStorage.getItem('rfi-selections') || '{}');
                const selectedIds = Object.keys(savedStates).filter(id => savedStates[id]);
                
                if (selectedIds.length === 0) {
                    alert("No items selected for export!");
                    return;
                }

                const rows = [["ID", "Question", "Description"].join(",")];
                let foundCount = 0;
                selectedIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el && el.checked) {
                        const container = el.closest('.rfi-card');
                        if (container) {
                            const questionEl = container.querySelector('.rfi-question');
                            const descEl = container.querySelector('.rfi-description');
                            if (questionEl && descEl) {
                                const question = `"${questionEl.innerText.trim().replace(/"/g, '""')}"`;
                                const description = `"${descEl.innerText.trim().replace(/"/g, '""')}"`;
                                rows.push(`${id},${question},${description}`);
                                foundCount++;
                            }
                        }
                    }
                });

                if (foundCount === 0) {
                    alert("No selected items were found in the current view. Please switch to the relevant category tab before exporting.");
                    return;
                }

                const csvContent = rows.join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `RFI_Export_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const exportBtn = document.getElementById('export-btn');
            if (exportBtn) exportBtn.addEventListener('click', exportCSV);

            const clearBtn = document.getElementById('clear-btn');
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    if (confirm("Are you sure you want to clear all selections? This cannot be undone.")) {
                        localStorage.removeItem('rfi-selections');
                        const activeTab = document.querySelector('nav button.active');
                        if (activeTab) {
                            htmx.ajax('GET', activeTab.getAttribute('hx-get'), '#content-area');
                        } else {
                            restoreCheckboxes();
                            updateCountIndicators();
                        }
                    }
                });
            }

            // Initial Bootstrap
            restoreCheckboxes();
            updateCountIndicators();
        });
    </script>
</head>
<body class="bg-slate-50 text-slate-90int min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white py-8 px-6 shadow-lg">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold tracking-tight">ECM RFI Template</h1>
            <p class="mt-2 text-slate-400">Microsoft 365 Document Management Solution Request for Information</p>
        </div>
    </header>

    <div class="max-w-4xl mx-auto w-full p-6 flex flex-col min-h-[calc(100vh-250px)]">
        
        <nav class="mb-8 flex flex-wrap gap-3" hx-boost="true">
            <button class="nav-btn active" hx-get="components/functional.html" hx-target="#content-area" hx-swap="innerHTML">
                Functional Requirements
            </button>
            <button class="nav-btn" hx-get="components/non-functional.html" hx-target="#content-area" hx-swap="innerHTML">
                Non-Functional Requirements
            </button>
            <button class="nav-btn" hx-get="components/vendor.html" hx-target="#content-area" hx-swap="innerHTML">
                Vendor Capability & Experience
            </button>
        </nav>

        <section id="content-area" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-grow">
            <div class="p-8 text-center text-slate-500 italic">
                Select a category above to begin reviewing RFI questions.
            </div>
        </section>
    </div>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-500 text-sm">
        <div class="max-w-4xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>&copy; 2026 ECM RFI Template • Built with HTMX & Tailwind</div>
            <div class="flex items-center gap-3">
                <button id="clear-btn" class="inline-flex items-center px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg font-semibold text-xs hover:bg-red-50 hover:text-red-600 transition-colors shadow-sm">
                    <svg class="w-4 h-<u>4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.169 21H7.831a2 2 0 01-1.994-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Clear All
                </button>
                <button id="export-btn" class="inline-flex items-center px-4 py-2 bg-slate-900 text-white rounded-lg font-semibold text-xs hover:bg-slate-800 transition-colors shadow-sm">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export Selected as CSV
                </button>
            </div>
        </div>
    </footer>

</body>
</html>
